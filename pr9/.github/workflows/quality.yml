name: CI — code quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pr9/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pr9/requirements-dev.txt

      - name: Static analysis
        run: python -m pylint pr9/src/status.py --score=no

      - name: Validate documentation
        run: mkdocs build --strict --site-dir /tmp/docs-site
        working-directory: pr9
